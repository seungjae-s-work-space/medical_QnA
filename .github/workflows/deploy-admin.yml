name: Deploy Admin Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/deploy-admin.yml'

  # 수동 실행 허용
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: |
          cd admin-web
          npm ci

      - name: Build
        run: |
          cd admin-web
          npm run build
        env:
          PUBLIC_URL: /medical_QnA

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./admin-web/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
