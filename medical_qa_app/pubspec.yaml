name: medical_qa_app
description: 의료 전문가 Q&A 앱

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # 상태 관리
  provider: ^6.1.1

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  intl: ^0.18.1

  # 유틸리티
  uuid: ^4.2.1
  shared_preferences: ^2.2.2

  # HTML 렌더링
  flutter_html: ^3.0.0-beta.2

  # 로컬 알림 (Android 채널 생성용)
  flutter_local_notifications: ^18.0.1

  # Windows 알림 & 트레이
  local_notifier: ^0.1.6
  tray_manager: ^0.2.3
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
