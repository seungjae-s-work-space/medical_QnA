<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>난임정보톡톡</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var redirectPath =
          window.location.pathname + window.location.search + window.location.hash;

        if (!redirectPath || redirectPath === '/') {
          window.location.replace('/');
          return;
        }

        window.location.replace('/?p=' + encodeURIComponent(redirectPath));
      })();
    </script>
  </head>
  <body>
    <p>페이지를 불러오는 중입니다...</p>
  </body>
</html>
